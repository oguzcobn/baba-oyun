name: Mobile browser smoke tests
on:
  workflow_dispatch:
  push:
    branches: [test/mobile-playwright-smoke-20261112, main]
    paths:
      - '.github/workflows/mobile-smoke.yml'
      - 'tests/mobile.spec.cjs'
      - 'tests/match2d-browser.spec.cjs'
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'sw.js'
jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.58.2
      - run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/baba-http.log 2>&1 &
      - run: npx playwright test tests/mobile.spec.cjs tests/match2d-browser.spec.cjs --reporter=line --workers=2
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-and-match-replay-results
          path: test-results/
