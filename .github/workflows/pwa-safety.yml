name: PWA safety checks
on:
  push:
    branches: [main]
    paths:
      - 'sw.js'
      - 'tests/sw-safety.cjs'
      - '.github/workflows/pwa-safety.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/sw-safety.cjs
