<script>
  const sb=document.getElementById('snd');sb.textContent=Snd.on?'🔊':'🔇';
  sb.onclick=()=>{sb.textContent=Snd.toggle()?'🔊':'🔇'};
  document.getElementById('lockBtn').onclick=()=>App.lock();
  const navLang=()=>{document.querySelectorAll('[data-en]').forEach(e=>{if(!e.dataset.tr)e.dataset.tr=e.textContent;e.textContent=I18N.lang==='en'?e.dataset.en:e.dataset.tr});document.querySelectorAll('[data-en-aria]').forEach(e=>{if(!e.dataset.trAria)e.dataset.trAria=e.getAttribute('aria-label');e.setAttribute('aria-label',I18N.lang==='en'?e.dataset.enAria:e.dataset.trAria)});document.querySelectorAll('.lang-sw button').forEach(b=>{const on=b.dataset.lang===I18N.lang;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)})};
  document.querySelectorAll('.lang-sw button').forEach(b=>b.onclick=()=>I18N.set(b.dataset.lang));
  I18N.on(()=>{navLang();App.render()});navLang();
  App.render();
  try{Is.start()}catch(e){}
  try{if(App.user())CBN.start()}catch(e){}
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update()})}).catch(()=>{});let done=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!done){done=true;location.reload()}})}
</script>
